<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheese System Sanctuary</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Georgia', serif; background: #e3f2fd; color: #2c3e50; text-align: center; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; border-top: 5px solid #d4af37; }
        button { background: #d4af37; color: white; border: none; padding: 12px 25px; border-radius: 20px; margin: 10px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Cheese System Sanctuary</h1>
    <div class="card">
        <h3>Fronting Now</h3>
        <p id="active-part">Unknown</p>
        <button onclick="logSwitch()">Log Switch</button>
    </div>
    <div class="card">
        <h3>Trigger Log</h3>
        <button style="background:#e57373;" onclick="alert('Negative trigger logged')">Negative</button>
        <button style="background:#81c784;" onclick="alert('Positive trigger logged')">Positive</button>
    </div>
    <script>
        function logSwitch() {
            let part = prompt("Who is at the front?");
            if(part) document.getElementById('active-part').innerText = part;
        }
    </script>
</body>
</html>
